name: Desktop Companion

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "desktop/companion/**"
      - ".github/workflows/desktop-companion.yml"
  push:
    branches: [main, dev]
    paths:
      - "desktop/companion/**"
      - ".github/workflows/desktop-companion.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop/companion

jobs:
  frontend:
    name: Frontend contract and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/companion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build production frontend
        run: npm run bundle

  native:
    name: Native contract and release compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/companion/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/companion/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test native core
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Lint native core
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Compile native release
        run: npm run desktop:build -- --no-bundle

  native-macos:
    name: macOS native bundle
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/companion/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/companion/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build macOS bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run desktop:build

      - name: Verify macOS signature and microphone permissions
        env:
          COMPANION_APP_PATH: src-tauri/target/release/bundle/macos/NyxID Companion.app
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          import subprocess
          from pathlib import Path

          app = Path(os.environ["COMPANION_APP_PATH"])
          subprocess.run(
              ["codesign", "--verify", "--deep", "--strict", "--verbose=2", str(app)],
              check=True,
          )
          with (app / "Contents" / "Info.plist").open("rb") as source:
              info = plistlib.load(source)
          usage = info.get("NSMicrophoneUsageDescription")
          if not isinstance(usage, str) or not usage.strip():
              raise SystemExit("macOS bundle has no microphone usage description")

          signed_entitlements = subprocess.run(
              ["codesign", "-d", "--entitlements", "-", "--xml", str(app)],
              check=True,
              capture_output=True,
          )
          entitlements = plistlib.loads(signed_entitlements.stdout)
          if entitlements.get("com.apple.security.device.audio-input") is not True:
              raise SystemExit("macOS signature has no audio-input entitlement")
          print(f"Verified signed microphone permissions: {app}")
          PY
